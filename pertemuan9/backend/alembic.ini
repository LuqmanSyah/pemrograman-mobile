# Konfigurasi Alembic. URL database TIDAK ditulis di sini, tetapi dibaca dari
# app.config.settings (lihat alembic/env.py) agar hanya ada satu sumber.

[alembic]
script_location = alembic
# Nama berkas revisi: 0001_buat_tabel_kegiatan.py (tanpa tanggal/hash acak).
file_template = %%(rev)s_%%(slug)s
# Menambahkan folder ini ke sys.path agar "import app" berhasil.
prepend_sys_path = .

# ---------------------------------------------------------------------------
# Konfigurasi log
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
